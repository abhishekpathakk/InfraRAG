[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infrarag"
version = "0.1.0"
description = "Serverless DevOps & SRE Runbook Q&A Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "fastembed>=0.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "terraform",
    ".agent",
    ".agents",
    ".claude",
    "_bmad",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Module level import not at top of file (used for sys.path setup)
    "E501",  # Line too long (prompt strings, runbook references)
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "types-boto3>=1.34.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
