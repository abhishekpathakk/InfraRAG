name: InfraRAG CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies from Lockfile
        run: uv sync --all-extras --dev

      - name: Verify Frozen Evaluation Datasets Integrity
        run: uv run python scripts/verify_frozen_datasets.py

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Mypy Static Type Checker
        run: uv run mypy src/

      - name: Run Pytest with Coverage
        run: USE_MOCK_BEDROCK=true uv run pytest --cov=src --cov-report=term-missing tests/

      - name: Run Autonomous Loop Engineer Self-Check
        run: USE_MOCK_BEDROCK=true uv run python scripts/loop_engineer.py --dry-run

  local-neural-smoke-test:
    name: Local Neural Default Pipeline Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies from Lockfile
        run: uv sync --all-extras --dev

      - name: Run Local Neural Retrieval Smoke Test (Zero Environment Variables)
        run: uv run pytest tests/test_local_pipeline.py -v

  terraform-validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Package Lambda Payload (Excluding raw data corpus)
        run: |
          mkdir -p terraform/build
          zip -r terraform/build/lambda_payload.zip src -x "*.pyc" -x "*__pycache__*"

      - name: Terraform Init & Validate
        run: |
          if [ -f terraform/main.tf ]; then
            terraform -chdir=terraform init -backend=false
            terraform -chdir=terraform validate
          fi
