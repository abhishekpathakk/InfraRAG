name: InfraRAG CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies from Lockfile
        run: uv sync --all-extras --dev

      - name: Cache Verified FastEmbed Model Weights
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-bge-small-sha256-51f1bd0addd6e859e42c2c8021a5e5461385bb676a649f4b269aa445449f2431

      - name: Verify Frozen Evaluation Datasets Integrity
        run: uv run python scripts/verify_frozen_datasets.py

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Mypy Static Type Checker
        run: uv run mypy src/

      - name: Run Pytest with Coverage
        run: USE_MOCK_BEDROCK=true uv run pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml tests/

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run Autonomous Loop Engineer Self-Check
        run: USE_MOCK_BEDROCK=true uv run python scripts/loop_engineer.py --dry-run

  local-neural-smoke-test:
    name: Local Neural Default Pipeline Smoke Test
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies from Lockfile
        run: uv sync --all-extras --dev

      - name: Cache Verified FastEmbed Model Weights
        id: cache-fastembed
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-bge-small-sha256-51f1bd0addd6e859e42c2c8021a5e5461385bb676a649f4b269aa445449f2431

      - name: Log Cache State
        run: |
          echo "FastEmbed Cache Hit: ${{ steps.cache-fastembed.outputs.cache-hit }}"
          if [ -d "${{ github.workspace }}/.cache/fastembed" ]; then
            echo "Cached contents:"
            find "${{ github.workspace }}/.cache/fastembed" -type f
          else
            echo "Cache not present prior to run."
          fi

      - name: Run Local Neural Retrieval Smoke Test (Zero Environment Variables)
        run: uv run pytest tests/test_local_pipeline.py -v -s

  security-and-sbom:
    name: Security Scan & SBOM Generation (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Run Trivy Vulnerability Scanner (JSON Report)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'reports/trivy-fs.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'reports/sbom.cyclonedx.json'

      - name: Run Trivy Secret Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          security-checks: 'secret'
          format: 'table'

      - name: Run Trivy Terraform Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'

      - name: Upload Security Reports & SBOM
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/

  sonar-analysis:
    name: SAST Security & SonarCloud Code Analysis
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Run Bandit Python AST Security Scan
        run: uv run --with bandit bandit -r src/ -ll -v

      - name: Download Coverage XML
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
        continue-on-error: true

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Notice on SonarCloud Token Configuration
        if: env.SONAR_TOKEN == ''
        run: |
          echo "=================================================================================="
          echo "ℹ️  Bandit SAST security scan completed successfully."
          echo "ℹ️  SONAR_TOKEN is not yet set in repository GitHub Secrets."
          echo "👉 To activate SonarCloud SaaS analysis:"
          echo "   1. Visit https://sonarcloud.io and log in with GitHub (@abhishekpathakk)"
          echo "   2. Import repository 'abhishekpathakk/InfraRAG'"
          echo "   3. Run: gh secret set SONAR_TOKEN --body '<your-token>'"
          echo "=================================================================================="

  terraform-validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Package Lambda Payload (Excluding raw data corpus)
        run: |
          mkdir -p terraform/build
          zip -r terraform/build/lambda_payload.zip src -x "*.pyc" -x "*__pycache__*"

      - name: Terraform Init & Validate
        run: |
          if [ -f terraform/main.tf ]; then
            terraform -chdir=terraform init -backend=false
            terraform -chdir=terraform validate
          fi

  stakeholder-digest:
    name: Stakeholder Operational & Security Digest
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-and-sbom]
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Download Security Reports Artifact
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports
        continue-on-error: true

      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .
        continue-on-error: true

      - name: Generate Stakeholder Digest (Console, HTML, Plaintext)
        env:
          SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
          SES_RECIPIENT_EMAILS: ${{ secrets.SES_RECIPIENT_EMAILS }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          uv run python scripts/generate_stakeholder_report.py \
            --trivy-report=reports/trivy-fs.json \
            --sbom=reports/sbom.cyclonedx.json \
            --coverage-xml=coverage.xml \
            --output-dir=reports \
            ${{ secrets.SES_SENDER_EMAIL && '--send-ses' || '' }}

      - name: Upload Stakeholder Digest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stakeholder-digest
          path: reports/
