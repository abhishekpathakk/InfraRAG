name: InfraRAG CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint, Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest with Coverage
        run: |
          USE_MOCK_BEDROCK=true pytest --cov=src --cov-report=term-missing tests/

      - name: Run Autonomous Loop Engineer Self-Check
        run: |
          USE_MOCK_BEDROCK=true python scripts/loop_engineer.py --dry-run

  terraform-validate:
    name: Terraform Validate & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Format Check
        run: |
          terraform -chdir=terraform fmt -check

      - name: Package Lambda Payload
        run: |
          mkdir -p terraform/build
          zip -r terraform/build/lambda_payload.zip src data -x "*.pyc" -x "*__pycache__*"

      - name: Terraform Init & Validate
        run: |
          if [ -f terraform/main.tf ]; then
            terraform -chdir=terraform init -backend=false
            terraform -chdir=terraform validate
          fi
